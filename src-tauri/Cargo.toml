[package]
name = "lumina"
version = "0.1.0"
description = "Lumina — desktop AI chat harness (OpenCode Go / Zen)"
authors = ["Lumina"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lumina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "gzip",
  "brotli",
] }

rusqlite = { version = "0.40", features = ["bundled"] }

anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

scraper = "0.29"
regex = "1"
zip = "9"
quick-xml = "0.42"
calamine = "0.37"
pdf-extract = "0.12"
encoding_rs = "0.8"
chardetng = "1"
infer = "0.22"
base64 = "0.23"
sha2 = "0.11"
mime_guess = "2"
url = "2"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
parking_lot = "0.13"
once_cell = "1"
percent-encoding = "2"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
