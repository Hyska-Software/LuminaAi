name: Installer (manual)

# Manual until the release process is finalized. Each job builds on its native
# host: macOS signing/notarization and Linux glibc baselines cannot be
# cross-built reliably from Windows.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/installer.yml'
      - 'installer.html'
      - 'installer/**'
      - 'scripts/**'
      - 'src/installer/**'
      - 'src-tauri/src/installer/**'
      - 'src-tauri/tauri.*.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'package.json'

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: ""
          - os: macos-14
            platform: macos
            args: "--universal"
          - os: ubuntu-22.04
            platform: linux
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust targets (macOS universal)
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf rpm \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Renderer and installer tests
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:installer

      # The Rust suite has pre-existing platform-specific assumptions on macOS
      # (e.g. /var vs /private/var). Artifact generation must not mask those;
      # they are tracked separately. Windows keeps the full suite locally.
      - name: Build installer
        run: pnpm installer --platform ${{ matrix.platform }} ${{ matrix.args }} --ci --require-clean --skip-tests --channel ${{ inputs.channel || 'stable' }}
        env:
          # Optional. Add these secrets when the certificates are available.
          LUMINA_WINDOWS_CERT_THUMBPRINT: ${{ secrets.LUMINA_WINDOWS_CERT_THUMBPRINT }}
          LUMINA_TIMESTAMP_URL: ${{ secrets.LUMINA_TIMESTAMP_URL }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}

      - name: Smoke test Windows setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/*/windows-*/*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'lumina-smoke'
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          Start-Process -FilePath $setup -ArgumentList @('--setup','--silent','--scope','user','--dir',$dir,'--no-desktop','--no-start-menu','--no-launch') -Wait
          if (-not (Test-Path (Join-Path $dir 'Lumina.exe'))) { throw 'Lumina.exe não foi instalado' }
          if (-not (Test-Path (Join-Path $dir '.lumina-install'))) { throw 'marcador de instalação ausente' }
          Start-Process -FilePath $setup -ArgumentList @('--uninstall','--silent') -Wait
          for ($i = 0; $i -lt 40 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $dir) { throw 'a pasta de instalação não foi removida' }

      - name: Smoke test macOS DMG
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          dmg=$(ls release/*/macos-*/*.dmg | head -n 1)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -noverify -noautoopen -nobrowse -readonly -mountpoint "$mount"
          test -d "$mount/Lumina.app"
          codesign --verify --deep --strict "$mount/Lumina.app"
          sudo ditto "$mount/Lumina.app" /Applications/Lumina.app
          test -d /Applications/Lumina.app
          sudo rm -rf /Applications/Lumina.app
          hdiutil detach "$mount"

      - name: Smoke test Linux packages
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          deb=$(ls release/*/linux-*/*.deb | head -n 1)
          debname=$(dpkg-deb -f "$deb" Package)
          sudo dpkg -i "$deb"
          test -x /usr/bin/lumina
          test -n "$(find /usr/share/applications -maxdepth 1 -iname '*lumina*.desktop' -print -quit)"
          sudo dpkg -r "$debname"
          ! test -e /usr/bin/lumina

          appimage=$(ls release/*/linux-*/*.AppImage | head -n 1)
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          rm -rf squashfs-root

          rpm=$(ls release/*/linux-*/*.rpm | head -n 1)
          rpmname=$(rpm -qp --qf '%{NAME}' "$rpm")
          rpm -qpl "$rpm" | grep -q '/usr/bin/lumina'
          sudo rpm -i --nodeps "$rpm"
          test -x /usr/bin/lumina
          sudo rpm -e "$rpmname"
          ! test -e /usr/bin/lumina

      - uses: actions/upload-artifact@v4
        with:
          name: lumina-${{ matrix.platform }}-${{ github.run_id }}
          path: release/**
          if-no-files-found: error
