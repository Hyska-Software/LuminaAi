name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub release as a draft
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      reason: ${{ steps.version.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version sources
        run: >-
          node --input-type=module -e
          "import('./scripts/installer/shared.mjs').then(({ assertVersionsInSync }) => console.log('Versão sincronizada:', assertVersionsInSync(process.cwd())))"

      - name: Resolve app version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Versão inválida em package.json: $VERSION" >&2
            exit 1
          fi

          LATEST=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' 2>/dev/null || true)
          LATEST_VERSION=""
          if [[ "$LATEST" == v* ]]; then
            LATEST_VERSION=${LATEST#v}
          fi

          SHOULD_RELEASE=true
          REASON="versão nova"
          if [[ -n "$LATEST_VERSION" ]]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST_VERSION" "$VERSION" | sort -V | tail -n 1)
            if [[ "$HIGHEST" != "$VERSION" ]]; then
              echo "A versão do app ($VERSION) é menor que a release mais recente ($LATEST_VERSION)." >&2
              echo "Atualize a versão do app e envie novamente para a main." >&2
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == "push" && "$LATEST_VERSION" == "$VERSION" ]]; then
              SHOULD_RELEASE=false
              REASON="a versão $VERSION já foi publicada"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          {
            echo "### Release v$VERSION"
            echo
            if [[ "$SHOULD_RELEASE" == "true" ]]; then
              echo "A release será publicada."
            else
              echo "Nada a publicar: $REASON."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            echo "Release v$VERSION"
          else
            echo "Sem release: $REASON"
          fi

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            args: ""
          # Apple Silicon only, on the newest arm64 image. The Intel slice is no
          # longer built, so there is no --universal and no cross-compile step.
          - os: macos-26
            platform: macos
            args: "--arch arm64"
          - os: ubuntu-22.04
            platform: linux
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf rpm \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release
        run: >-
          pnpm installer
          --platform ${{ matrix.platform }}
          ${{ matrix.args }}
          --skip-tests
          --ci
          --require-clean
          --channel stable
        env:
          ZYLARA_WINDOWS_CERT_THUMBPRINT: ${{ secrets.ZYLARA_WINDOWS_CERT_THUMBPRINT }}
          ZYLARA_TIMESTAMP_URL: ${{ secrets.ZYLARA_TIMESTAMP_URL }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: zylara-${{ matrix.platform }}
          path: release/**
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DRAFT: ${{ inputs.draft || false }}
    steps:
      # gh release create needs a git repository to create the tag when the
      # workflow is dispatched manually (tag pushes already have one).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zylara-*
          path: release
          merge-multiple: true

      - name: Combine release assets
        run: node scripts/combine-release.mjs release dist

      - name: Publish or update release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find dist -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum artefato encontrado." >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; atualizando assets."
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "Zylara $TAG" --draft="$DRAFT"
          else
            echo "Criando release $TAG."
            extra=()
            if [ "$DRAFT" = "true" ]; then
              extra+=(--draft)
            fi
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Zylara $TAG" \
              --generate-notes \
              "${extra[@]}"
          fi

          {
            echo "### Zylara $TAG"
            echo
            echo "Artefatos publicados:"
            echo
            find dist -type f | sort | while read -r file; do
              echo "- \`$file\`"
            done
            echo
            echo "Checksums:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
