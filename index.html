<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f12" />
    <title>Lumina</title>
    <link rel="icon" type="image/svg+xml" href="/brand/lumina-tile.svg" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0f0f12;
      }
      html.light,
      html.light body,
      html.light #root {
        background: #ffffff;
      }
    </style>
    <script>
      // Apply persisted theme before paint to avoid a flash.
      try {
        const stored = JSON.parse(localStorage.getItem('lumina.ui') || '{}');
        const theme = stored?.state?.theme || 'system';
        const dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="h-full antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
