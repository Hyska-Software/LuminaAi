<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f12" />
    <title>Zylara</title>
    <link rel="icon" type="image/svg+xml" href="/brand/zylara-tile.svg" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: var(--background, #0f0f12);
      }
      #root {
        height: 100%;
        margin: 0;
        background-color: transparent;
      }
      html.light,
      html.light body {
        background-color: var(--background, #ffffff);
      }
    </style>
    <script>
      // Apply persisted theme before paint to avoid a flash.
      try {
        const stored = JSON.parse(localStorage.getItem('zylara.ui') || '{}');
        const theme = stored?.state?.theme || 'system';
        const dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.classList.toggle('light', !dark);
        const cached = JSON.parse(localStorage.getItem('zylara.theme.cache') || 'null');
        if (cached && typeof cached === 'object') {
          const tokens = dark ? cached.dark : cached.light;
          if (tokens && typeof tokens === 'object') {
            const names = [];
            for (const [key, value] of Object.entries(tokens)) {
              if (!/^[a-z0-9-]+$/.test(key) || typeof value !== 'string' || value.length > 64) continue;
              const name = key.startsWith('radius-') ? `theme-${key}` : key;
              document.documentElement.style.setProperty(`--${name}`, value);
              names.push(name);
            }
            if (names.length) document.documentElement.dataset.themeTokens = names.join(',');
          }
        }
      } catch {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="h-full antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
